name: Android CI
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare signing keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/igris-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk dist/igris-release.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: igris-apks
          path: dist/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "IGRIS ${GITHUB_REF_NAME}" \
            --notes "Install igris-release.apk (enable unknown sources). Uninstall older CI builds first." \
            dist/igris-debug.apk dist/igris-release.apk
